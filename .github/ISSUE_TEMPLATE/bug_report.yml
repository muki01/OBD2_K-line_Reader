name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can. Serial logs are the most helpful part.
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - WebServer_Code
        - Basic_Code
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: e.g. ESP32-S3 DevKitC-1, Arduino Nano, NodeMCU ESP8266
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: K-Line interface
      options:
        - Transistor-based
        - Comparator (LM393)
        - L9637D
        - MC33290
        - Si9241
        - SN65HVDA195
        - Other / custom PCB
    validations:
      required: true
  - type: input
    id: vehicle
    attributes:
      label: Vehicle
      placeholder: Make, model, year, engine (e.g. Opel Astra H 2006 1.6 Z16XEP)
  - type: dropdown
    id: protocol
    attributes:
      label: Selected protocol
      options:
        - Automatic
        - ISO 9141-2
        - ISO 14230 KWP2000 (slow init)
        - ISO 14230 KWP2000 (fast init)
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Serial debug output
      description: Enable `DEBUG_Serial` and paste the log (sent / received bytes). Remove your VIN if you prefer.
      render: text
